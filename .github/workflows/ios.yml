name: iOS app

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore Kotlin/Native toolchain
        id: konan
        uses: actions/cache/restore@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Install XcodeGen
        run: brew install xcodegen xcbeautify
      - name: Show Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep iPhone || true
      - name: Run unit tests and UI tests
        run: iosApp/scripts/test.sh
      - name: Capture screenshots (dark and light)
        if: always()
        continue-on-error: true
        run: iosApp/scripts/test.sh screenshots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Screenshots
          path: iosApp/build/screenshots
          if-no-files-found: warn
      - name: Save Kotlin/Native toolchain
        if: always() && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.konan
          key: ${{ steps.konan.outputs.cache-primary-key }}
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: |
            iosApp/build/TestResults.xcresult
            iosApp/build/xcodebuild.log
