# Generate the Xcode project with: cd iosApp && xcodegen
name: TaskWall
options:
  bundleIdPrefix: app.taskwall
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TaskWall:
    type: application
    platform: iOS
    sources:
      - path: TaskWall
    info:
      path: TaskWall/Info.plist
      properties:
        CFBundleDisplayName: TaskWall
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: TaskWall saves your wallpaper image to Photos when you tap Save Image.
        LSApplicationQueriesSchemes: [shortcuts]
        CFBundleURLTypes:
          - CFBundleURLName: app.taskwall
            CFBundleURLSchemes: [taskwall]
    entitlements:
      path: TaskWall/TaskWall.entitlements
      properties:
        com.apple.security.application-groups: [group.app.taskwall]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.taskwall
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [$(inherited), -framework, Shared]
    preBuildScripts:
      - name: Build Kotlin shared framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    scheme:
      storeKitConfiguration: TaskWall/Resources/TaskWall.storekit
