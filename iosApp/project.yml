# Generate the Xcode project with: cd iosApp && xcodegen
name: TaskWall
options:
  bundleIdPrefix: app.taskwall
  # Synchronized folders: Xcode picks up added and removed files by itself, so the
  # committed project only needs regenerating when this file changes.
  projectFormat: xcode16_0
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    # Signing team, so Xcode doesn't reset it to None after every pull.
    DEVELOPMENT_TEAM: 9KHCK2Z846
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TaskWall:
    type: application
    platform: iOS
    sources:
      - path: TaskWall
        type: syncedFolder
    info:
      path: TaskWall/Info.plist
      properties:
        CFBundleDisplayName: TaskWall
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSAccentColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: TaskWall saves your wallpaper image to Photos when you tap Save Image.
        LSApplicationQueriesSchemes: [shortcuts]
        CFBundleURLTypes:
          - CFBundleURLName: app.taskwall
            CFBundleURLSchemes: [taskwall]
    entitlements:
      path: TaskWall/TaskWall.entitlements
      properties:
        com.apple.security.application-groups: [group.app.taskwall]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.taskwall
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [$(inherited), -framework, Shared]
    preBuildScripts:
      - name: Build Kotlin shared framework
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/scripts/build-shared.sh"
    scheme:
      storeKitConfiguration: TaskWall/Resources/TaskWall.storekit
      testTargets:
        - TaskWallTests
        - TaskWallUITests

  # Unit tests run inside the app, so they share its copy of the Shared framework.
  TaskWallTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TaskWallTests
        type: syncedFolder
    dependencies:
      - target: TaskWall
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)

  TaskWallUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TaskWallUITests
        type: syncedFolder
    dependencies:
      - target: TaskWall
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
